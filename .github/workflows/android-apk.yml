
name: Build Rudrax Vault APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Rudrax Vault APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project ZIP
        shell: bash
        run: |
          ls -lah
          if [ ! -f "RudraxVault-GitHub-Ready.zip" ]; then
            echo "ERROR: RudraxVault-GitHub-Ready.zip not found"
            exit 1
          fi

      - name: Extract Android project
        shell: bash
        run: |
          unzip -o RudraxVault-GitHub-Ready.zip -d extracted

          if [ ! -f "extracted/RudraxVault/app/build.gradle.kts" ]; then
            echo "ERROR: Android project was not found inside ZIP"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          cp -r extracted/RudraxVault ./RudraxVault

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "Locating SDK Manager..."

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_HOME" -type f -name sdkmanager \
              2>/dev/null || true
            exit 1
          fi

          echo "SDK Manager found: $SDKMANAGER"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager is not executable"
            ls -l "$SDKMANAGER"
            exit 1
          fi

          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -o pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: RudraxVault
        shell: bash
        run: |
          gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="RudraxVault/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RudraxVault-debug-apk
          path: RudraxVault/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
