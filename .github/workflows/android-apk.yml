
name: Build Rudrax Vault APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project ZIP
        run: |
          ls -la
          test -f RudraxVault-GitHub-Ready.zip

      - name: Extract Android project
        run: |
          unzip -o RudraxVault-GitHub-Ready.zip -d extracted
          test -f extracted/RudraxVault/app/build.gradle.kts
          cp -r extracted/RudraxVault ./RudraxVault

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: RudraxVault
        run: |
          gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -f RudraxVault/app/build/outputs/apk/debug/app-debug.apk
          ls -lh RudraxVault/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RudraxVault-debug-apk
          path: RudraxVault/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
