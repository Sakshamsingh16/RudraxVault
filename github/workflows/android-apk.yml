
name: Build Rudrax Vault APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'RudraxVault-GitHub-Ready.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o RudraxVault-GitHub-Ready.zip -d extracted
          test -f extracted/RudraxVault/app/build.gradle.kts
          cp -r extracted/RudraxVault ./RudraxVault

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APK
        working-directory: RudraxVault
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RudraxVault-debug-apk
          path: RudraxVault/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
